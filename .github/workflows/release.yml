name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release + upload the asset

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate + provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          # Make the new keychain searchable without dropping the login keychain.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          echo "$PROFILE_BASE64" | base64 --decode > icloud-secret.provisionprofile

      - name: Build, sign, notarize
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          PROFILE="icloud-secret.provisionprofile" \
          NOTARY_API_KEY="$RUNNER_TEMP/notary.p8" \
          NOTARY_KEY_ID="$NOTARY_KEY_ID" \
          NOTARY_ISSUER="$NOTARY_ISSUER" \
          scripts/build-sign.sh

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/icloud-secret-macos-universal.zip
          generate_release_notes: true
